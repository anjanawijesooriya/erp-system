<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vertex ERP — Add staff member</title>
<style>
  body{margin:0;font-family:'Inter',system-ui,-apple-system,sans-serif;background:#F6F7FB;color:#101323}
  a{color:#4338CA;text-decoration:none}
  a:hover{color:#352C9B}
  .card{background:#fff;border:1px solid #E4E7EC;border-radius:14px}
  .btn-primary{background:#4338CA;color:#fff}
  .btn-primary:hover{background:#352C9B;color:#fff;text-decoration:none}
  input,select,textarea{font-family:inherit}
  .field{display:flex;flex-direction:column;gap:6px}
  .field label{font-size:12.5px;font-weight:600;color:#344054}
  .field input, .field select{height:42px;border-radius:9px;border:1px solid #D0D5DD;padding:0 13px;font-size:13.5px;outline:none;box-sizing:border-box}
  .section-title{font-size:14.5px;font-weight:700;display:flex;align-items:center;gap:8px}
</style>
</head>
<body>

<div style="min-height:1500px;width:100%;box-sizing:border-box;background:#F6F7FB">

  <header style="height:64px;background:#fff;border-bottom:1px solid #E4E7EC;display:flex;align-items:center;justify-content:space-between;padding:0 28px;box-sizing:border-box">
    <div style="display:flex;align-items:center;gap:16px">
      <a href="users.html" aria-label="Back" style="width:34px;height:34px;border-radius:9px;border:1px solid #E4E7EC;display:flex;align-items:center;justify-content:center;color:#475467">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M15 18l-6-6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </a>
      <div style="font-size:13.5px;color:#98A2B3;display:flex;align-items:center;gap:6px">
        <span>Master data</span><span>/</span><span>Staff &amp; users</span><span>/</span><span style="color:#1D2130;font-weight:600">Add staff</span>
      </div>
    </div>
    <div style="display:flex;align-items:center;gap:10px">
      <a href="users.html" style="height:38px;padding:0 16px;border-radius:9px;border:1px solid #D0D5DD;display:flex;align-items:center;font-size:13.5px;font-weight:600;color:#344054">Cancel</a>
      <a href="users.html" class="btn-primary" style="height:38px;padding:0 18px;border-radius:9px;display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:600">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M5 12l4.5 4.5L19 7" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Save staff member
      </a>
    </div>
  </header>

  <main style="max-width:1120px;margin:0 auto;padding:32px 24px 64px;display:flex;flex-direction:column;gap:20px;box-sizing:border-box">

    <div>
      <h1 style="margin:0 0 4px;font-size:22px;font-weight:700;letter-spacing:-0.01em">Add staff member</h1>
      <p style="margin:0;font-size:13.5px;color:#6B7280">Create a new user account with specific branch access.</p>
    </div>

    <section style="display:grid;grid-template-columns:200px 1fr;gap:20px;align-items:start">
      <div class="card" style="padding:18px;display:flex;flex-direction:column;align-items:center;gap:10px">
        <div style="width:120px;height:120px;border-radius:50%;background:#F3F4F7;display:flex;align-items:center;justify-content:center;position:relative">
          <svg width="46" height="46" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="8" r="3.6" stroke="#98A2B3" stroke-width="1.6"/><path d="M4 20c0-4.1 3.4-7.5 8-7.5s8 3.4 8 7.5" stroke="#98A2B3" stroke-width="1.6"/></svg>
          <div style="position:absolute;bottom:4px;right:4px;width:32px;height:32px;border-radius:50%;background:#4338CA;display:flex;align-items:center;justify-content:center"><svg width="15" height="15" viewBox="0 0 24 24" fill="none"><path d="M4 7h3l2-3h6l2 3h3v12H4V7z" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"/><circle cx="12" cy="13" r="3.2" stroke="#fff" stroke-width="1.6"/></svg></div>
        </div>
        <span style="font-size:12px;font-weight:600">Profile photo</span>
        <span style="font-size:11px;color:#98A2B3;text-align:center">Allowed *.jpeg, *.jpg, *.png, *.gif</span>
      </div>

      <div class="card" style="padding:22px;display:flex;flex-direction:column;gap:18px">
        <span class="section-title">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="8" r="3.5" stroke="#4338CA" stroke-width="1.7"/><path d="M5 20c0-3.9 3.1-7 7-7s7 3.1 7 7" stroke="#4338CA" stroke-width="1.7" stroke-linecap="round"/></svg>
          Personal information
        </span>
        <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:18px">
          <div class="field">
            <label>Branch *</label>
            <select><option>Select branch</option><option>Main Branch</option><option>Kandy Warehouse</option><option>Galle Outlet</option></select>
          </div>
          <div class="field">
            <label>Title</label>
            <select><option>Select title</option><option>Mr</option><option>Mrs</option><option>Miss</option></select>
          </div>
          <div class="field">
            <label>First name *</label>
            <input placeholder="e.g. Ranil" />
          </div>
        </div>
        <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:18px">
          <div class="field">
            <label>Last name *</label>
            <input placeholder="e.g. Fernando" />
          </div>
          <div class="field">
            <label>Email *</label>
            <input placeholder="name@company.com" />
          </div>
          <div class="field">
            <label>Primary contact *</label>
            <input placeholder="07X XXX XXXX" />
          </div>
        </div>
        <div class="field">
          <label>Secondary contact</label>
          <input placeholder="Optional" />
        </div>
      </div>
    </section>

    <section class="card" style="padding:22px;display:flex;flex-direction:column;gap:18px">
      <span class="section-title">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M12 21s-7-5.1-7-11a7 7 0 0114 0c0 5.9-7 11-7 11z" stroke="#4338CA" stroke-width="1.7" stroke-linejoin="round"/><circle cx="12" cy="10" r="2.4" stroke="#4338CA" stroke-width="1.6"/></svg>
        Address details
      </span>
      <div style="display:grid;grid-template-columns:1.6fr 1fr 1fr;gap:18px">
        <div class="field">
          <label>Street address *</label>
          <input placeholder="House no, street" />
        </div>
        <div class="field">
          <label>City *</label>
          <input placeholder="e.g. Kohalwila" />
        </div>
        <div class="field">
          <label>District *</label>
          <input placeholder="e.g. Galle" />
        </div>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:18px">
        <div class="field">
          <label>State / Province *</label>
          <input placeholder="e.g. Southern" />
        </div>
        <div class="field">
          <label>Country *</label>
          <input value="Sri Lanka" />
        </div>
      </div>
    </section>

    <section class="card" style="padding:22px;display:flex;flex-direction:column;gap:18px">
      <span class="section-title">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><rect x="3" y="4" width="18" height="16" rx="2" stroke="#4338CA" stroke-width="1.7"/><path d="M3 9h18" stroke="#4338CA" stroke-width="1.7"/><circle cx="9" cy="14" r="1.6" fill="#4338CA"/></svg>
        Role &amp; access
      </span>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:18px">
        <div class="field">
          <label>Role *</label>
          <select><option>Select role</option><option>Owner</option><option>Accountant</option><option>Cashier</option><option>Stock keeper</option></select>
        </div>
        <div class="field">
          <label>Branch access scope</label>
          <select><option>Selected branch only</option><option>All branches (current company)</option><option>All companies (system wide)</option></select>
        </div>
      </div>
      <div style="display:flex;gap:28px;padding-top:4px">
        <label style="display:flex;align-items:center;gap:8px;font-size:13px;color:#475467">
          <input type="checkbox" style="width:16px;height:16px;accent-color:#4338CA" />
          Access all branches (current company)
        </label>
        <label style="display:flex;align-items:center;gap:8px;font-size:13px;color:#475467">
          <input type="checkbox" style="width:16px;height:16px;accent-color:#4338CA" />
          Access all companies (system wide)
        </label>
      </div>
    </section>

  </main>
</div>
</body>
</html>
