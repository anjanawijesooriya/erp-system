<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vertex ERP — Delivery note</title>
<style>
  body{margin:0;font-family:'Inter',system-ui,-apple-system,sans-serif;background:#F6F7FB;color:#101323}
  a{color:#4338CA;text-decoration:none}
  a:hover{color:#352C9B}
  .card{background:#fff;border:1px solid #E4E7EC;border-radius:14px}
  .btn-primary{background:#4338CA;color:#fff}
  .btn-primary:hover{background:#352C9B;color:#fff;text-decoration:none}
  input,select,textarea{font-family:inherit}
  .field{display:flex;flex-direction:column;gap:6px}
  .field label{font-size:12.5px;font-weight:600;color:#344054}
  .field input, .field select{height:42px;border-radius:9px;border:1px solid #D0D5DD;padding:0 13px;font-size:13.5px;outline:none;box-sizing:border-box}
</style>
</head>
<body>

<div style="min-height:1400px;width:100%;box-sizing:border-box;background:#F6F7FB">

  <header style="height:64px;background:#fff;border-bottom:1px solid #E4E7EC;display:flex;align-items:center;justify-content:space-between;padding:0 28px;box-sizing:border-box">
    <div style="display:flex;align-items:center;gap:16px">
      <a href="sales-order.html" aria-label="Back" style="width:34px;height:34px;border-radius:9px;border:1px solid #E4E7EC;display:flex;align-items:center;justify-content:center;color:#475467">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M15 18l-6-6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </a>
      <div style="font-size:13.5px;color:#98A2B3;display:flex;align-items:center;gap:6px">
        <span>Sales</span><span>/</span><span>Deliveries</span><span>/</span><span style="color:#1D2130;font-weight:600">DO-0088</span>
      </div>
    </div>
    <div style="display:flex;align-items:center;gap:10px">
      <a href="invoices.html" style="height:38px;padding:0 16px;border-radius:9px;border:1px solid #D0D5DD;display:flex;align-items:center;gap:7px;font-size:13.5px;font-weight:600;color:#344054">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M9 12l2 2 4-4" stroke="#344054" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Print delivery note
      </a>
      <a href="receivables.html" class="btn-primary" style="height:38px;padding:0 18px;border-radius:9px;display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:600">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M5 12l4.5 4.5L19 7" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Mark as delivered
      </a>
    </div>
  </header>

  <main style="max-width:1120px;margin:0 auto;padding:32px 24px 64px;display:flex;flex-direction:column;gap:20px;box-sizing:border-box">

    <div style="display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:12px">
      <div>
        <h1 style="margin:0 0 4px;font-size:22px;font-weight:700;letter-spacing:-0.01em">Delivery note DO-0088</h1>
        <p style="margin:0;font-size:13.5px;color:#6B7280">For sales order SO-0231 · Oshan Lahiru</p>
      </div>
      <span style="font-size:12px;font-weight:600;color:#B45309;background:#FFF4E5;border-radius:999px;padding:5px 12px">Out for delivery</span>
    </div>

    <section class="card" style="padding:22px;display:grid;grid-template-columns:1.3fr 1fr 1fr 1fr;gap:18px">
      <div class="field">
        <label>Deliver to *</label>
        <input value="119/2, Polhena, Kohalwila" />
      </div>
      <div class="field">
        <label>Driver / courier</label>
        <input value="Ranil Fernando" />
      </div>
      <div class="field">
        <label>Dispatch date</label>
        <input type="date" value="2026-07-19" />
      </div>
      <div class="field">
        <label>Vehicle no.</label>
        <input value="WP CAB-4521" />
      </div>
    </section>

    <section class="card" style="display:flex;flex-direction:column;overflow:hidden">
      <div style="padding:16px 20px;border-bottom:1px solid #E4E7EC">
        <h3 style="margin:0;font-size:14.5px;font-weight:700">Items to deliver</h3>
      </div>
      <div style="display:grid;grid-template-columns:0.4fr 2fr 0.9fr 0.9fr;padding:11px 20px;font-size:11.5px;font-weight:700;color:#98A2B3;letter-spacing:0.04em;text-transform:uppercase;background:#FAFAFC;border-bottom:1px solid #EEF0F3">
        <span></span><span>Item</span><span>Ordered</span><span>Packed</span>
      </div>
      <div style="display:grid;grid-template-columns:0.4fr 2fr 0.9fr 0.9fr;padding:13px 20px;font-size:13.5px;align-items:center;border-bottom:1px solid #F3F4F7">
        <input type="checkbox" checked style="width:16px;height:16px;accent-color:#4338CA" />
        <span style="font-weight:600">Hikvision CCTV camera</span><span style="color:#667085">4</span><span style="color:#15803D;font-weight:600">4</span>
      </div>
      <div style="display:grid;grid-template-columns:0.4fr 2fr 0.9fr 0.9fr;padding:13px 20px;font-size:13.5px;align-items:center">
        <input type="checkbox" style="width:16px;height:16px;accent-color:#4338CA" />
        <span style="font-weight:600">Oil filter</span><span style="color:#667085">5</span><span style="color:#B45309;font-weight:600">4 (backordered 1)</span>
      </div>
    </section>

    <section class="card" style="padding:20px;display:flex;flex-direction:column;gap:10px">
      <label style="font-size:12.5px;font-weight:600;color:#344054">Delivery notes</label>
      <textarea placeholder="Access instructions, recipient name…" style="min-height:80px;border-radius:9px;border:1px solid #D0D5DD;padding:11px 13px;font-size:13.5px;resize:vertical;box-sizing:border-box;outline:none">Leave with security if customer unavailable. Call ahead 30 min before arrival.</textarea>
    </section>

  </main>
</div>
</body>
</html>
