<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vertex ERP — New product</title>
<style>
  body{margin:0;font-family:'Inter',system-ui,-apple-system,sans-serif;background:#F6F7FB;color:#101323}
  a{color:#4338CA;text-decoration:none}
  a:hover{color:#352C9B}
  .card{background:#fff;border:1px solid #E4E7EC;border-radius:14px}
  .btn-primary{background:#4338CA;color:#fff}
  .btn-primary:hover{background:#352C9B;color:#fff;text-decoration:none}
  input,select,textarea{font-family:inherit}
  .field{display:flex;flex-direction:column;gap:6px}
  .field label{font-size:12.5px;font-weight:600;color:#344054}
  .field input, .field select{height:42px;border-radius:9px;border:1px solid #D0D5DD;padding:0 13px;font-size:13.5px;outline:none;box-sizing:border-box}
  .section-title{font-size:14.5px;font-weight:700;display:flex;align-items:center;gap:8px}
</style>
</head>
<body>

<div style="min-height:1500px;width:100%;box-sizing:border-box;background:#F6F7FB">

  <header style="height:64px;background:#fff;border-bottom:1px solid #E4E7EC;display:flex;align-items:center;justify-content:space-between;padding:0 28px;box-sizing:border-box">
    <div style="display:flex;align-items:center;gap:16px">
      <a href="products.html" aria-label="Back" style="width:34px;height:34px;border-radius:9px;border:1px solid #E4E7EC;display:flex;align-items:center;justify-content:center;color:#475467">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M15 18l-6-6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </a>
      <div style="font-size:13.5px;color:#98A2B3;display:flex;align-items:center;gap:6px">
        <span>Master data</span><span>/</span><span>Products</span><span>/</span><span style="color:#1D2130;font-weight:600">New product</span>
      </div>
    </div>
    <div style="display:flex;align-items:center;gap:10px">
      <a href="products.html" style="height:38px;padding:0 16px;border-radius:9px;border:1px solid #D0D5DD;display:flex;align-items:center;font-size:13.5px;font-weight:600;color:#344054">Cancel</a>
      <a href="products.html" class="btn-primary" style="height:38px;padding:0 18px;border-radius:9px;display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:600">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M5 12l4.5 4.5L19 7" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Save product
      </a>
    </div>
  </header>

  <main style="max-width:1120px;margin:0 auto;padding:32px 24px 64px;display:flex;flex-direction:column;gap:20px;box-sizing:border-box">

    <div>
      <h1 style="margin:0 0 4px;font-size:22px;font-weight:700;letter-spacing:-0.01em">New product</h1>
      <p style="margin:0;font-size:13.5px;color:#6B7280">Define a product or service once — used across invoices, POS, and purchase orders.</p>
    </div>

    <section style="display:grid;grid-template-columns:200px 1fr;gap:20px;align-items:start">
      <div class="card" style="padding:18px;display:flex;flex-direction:column;align-items:center;gap:10px">
        <div style="width:140px;height:140px;border-radius:12px;background:#F3F4F7;display:flex;align-items:center;justify-content:center;position:relative">
          <svg width="34" height="34" viewBox="0 0 24 24" fill="none"><rect x="3" y="4" width="18" height="16" rx="2" stroke="#98A2B3" stroke-width="1.6"/><circle cx="9" cy="10" r="2" stroke="#98A2B3" stroke-width="1.6"/><path d="M4 18l5-5 4 4 3-3 4 4" stroke="#98A2B3" stroke-width="1.6"/></svg>
          <div style="position:absolute;bottom:8px;right:8px;width:30px;height:30px;border-radius:50%;background:#4338CA;display:flex;align-items:center;justify-content:center"><svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="#fff" stroke-width="2" stroke-linecap="round"/></svg></div>
        </div>
        <span style="font-size:12px;color:#98A2B3;text-align:center">JPG, PNG — up to 2MB</span>
      </div>

      <div class="card" style="padding:22px;display:flex;flex-direction:column;gap:18px">
        <div style="display:grid;grid-template-columns:1.6fr 1fr;gap:18px">
          <div class="field">
            <label>Product name *</label>
            <input value="Samsung Galaxy M55" />
          </div>
          <div class="field">
            <label>SKU / code</label>
            <input value="PROD-051572" disabled style="background:#F9FAFB;color:#667085" />
          </div>
        </div>
        <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:18px">
          <div class="field">
            <label>Category *</label>
            <select><option>Phone</option><option>Electronics</option><option>Engine parts</option></select>
          </div>
          <div class="field">
            <label>Brand</label>
            <input value="Samsung" />
          </div>
          <div class="field">
            <label>Unit type</label>
            <select><option>No. of items</option><option>Kilograms</option><option>Litres</option><option>Hours</option></select>
          </div>
        </div>
        <div class="field">
          <label>Barcode</label>
          <input value="8806094928374" />
        </div>
      </div>
    </section>

    <section class="card" style="padding:22px;display:flex;flex-direction:column;gap:18px">
      <span class="section-title">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><rect x="3" y="6" width="18" height="13" rx="2" stroke="#4338CA" stroke-width="1.7"/><path d="M3 10h18" stroke="#4338CA" stroke-width="1.7"/></svg>
        Pricing
      </span>
      <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:18px">
        <div class="field">
          <label>Cost price (LKR)</label>
          <input value="90,000.00" />
        </div>
        <div class="field">
          <label>Selling price (LKR) *</label>
          <input value="100,000.00" />
        </div>
        <div class="field">
          <label>Tax rate</label>
          <select><option>8% VAT</option><option>No tax</option></select>
        </div>
        <div class="field">
          <label>Margin</label>
          <input value="10.0%" disabled style="background:#F9FAFB;color:#15803D;font-weight:600" />
        </div>
      </div>
    </section>

    <section class="card" style="padding:22px;display:flex;flex-direction:column;gap:18px">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <span class="section-title">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M3 7l9-4 9 4-9 4-9-4z" stroke="#4338CA" stroke-width="1.7" stroke-linejoin="round"/><path d="M3 7v10l9 4 9-4V7" stroke="#4338CA" stroke-width="1.7" stroke-linejoin="round"/></svg>
          Inventory tracking
        </span>
        <label style="display:flex;align-items:center;gap:8px;font-size:13px;color:#475467">
          <input type="checkbox" checked style="width:16px;height:16px;accent-color:#4338CA" />
          Track stock for this item
        </label>
      </div>
      <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:18px">
        <div class="field">
          <label>Opening stock</label>
          <input value="0" />
        </div>
        <div class="field">
          <label>Reorder level</label>
          <input value="10" />
        </div>
        <div class="field">
          <label>Default warehouse</label>
          <select><option>Main Branch</option><option>Kandy Warehouse</option></select>
        </div>
      </div>
    </section>

    <section class="card" style="padding:22px;display:flex;flex-direction:column;gap:10px">
      <label style="font-size:12.5px;font-weight:600;color:#344054">Description</label>
      <textarea placeholder="Internal notes or customer-facing description…" style="min-height:90px;border-radius:9px;border:1px solid #D0D5DD;padding:11px 13px;font-size:13.5px;resize:vertical;box-sizing:border-box;outline:none"></textarea>
    </section>

  </main>
</div>
</body>
</html>
