<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vertex ERP — Stock transfer</title>
<style>
  body{margin:0;font-family:'Inter',system-ui,-apple-system,sans-serif;background:#F6F7FB;color:#101323}
  a{color:#4338CA;text-decoration:none}
  a:hover{color:#352C9B}
  .card{background:#fff;border:1px solid #E4E7EC;border-radius:14px}
  .btn-primary{background:#4338CA;color:#fff}
  .btn-primary:hover{background:#352C9B;color:#fff;text-decoration:none}
  input,select,textarea{font-family:inherit}
  .field{display:flex;flex-direction:column;gap:6px}
  .field label{font-size:12.5px;font-weight:600;color:#344054}
  .field input, .field select{height:42px;border-radius:9px;border:1px solid #D0D5DD;padding:0 13px;font-size:13.5px;outline:none;box-sizing:border-box}
</style>
</head>
<body>

<div style="min-height:1400px;width:100%;box-sizing:border-box;background:#F6F7FB">

  <header style="height:64px;background:#fff;border-bottom:1px solid #E4E7EC;display:flex;align-items:center;justify-content:space-between;padding:0 28px;box-sizing:border-box">
    <div style="display:flex;align-items:center;gap:16px">
      <a href="inventory.html" aria-label="Back" style="width:34px;height:34px;border-radius:9px;border:1px solid #E4E7EC;display:flex;align-items:center;justify-content:center;color:#475467">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M15 18l-6-6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </a>
      <div style="font-size:13.5px;color:#98A2B3;display:flex;align-items:center;gap:6px">
        <span>Inventory</span><span>/</span><span>Transfers</span><span>/</span><span style="color:#1D2130;font-weight:600">New</span>
      </div>
    </div>
    <div style="display:flex;align-items:center;gap:10px">
      <a href="inventory.html" style="height:38px;padding:0 16px;border-radius:9px;border:1px solid #D0D5DD;display:flex;align-items:center;font-size:13.5px;font-weight:600;color:#344054">Save as draft</a>
      <a href="warehouses.html" class="btn-primary" style="height:38px;padding:0 18px;border-radius:9px;display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:600">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M5 12l4.5 4.5L19 7" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Dispatch transfer
      </a>
    </div>
  </header>

  <main style="max-width:1120px;margin:0 auto;padding:32px 24px 64px;display:flex;flex-direction:column;gap:20px;box-sizing:border-box">

    <div>
      <h1 style="margin:0 0 4px;font-size:22px;font-weight:700;letter-spacing:-0.01em">New stock transfer</h1>
      <p style="margin:0;font-size:13.5px;color:#6B7280">Move stock between branches or warehouses.</p>
    </div>

    <section class="card" style="padding:22px;display:grid;grid-template-columns:1fr auto 1fr 1fr;gap:18px;align-items:end">
      <div class="field">
        <label>From *</label>
        <select>
          <option>Main Branch</option>
          <option>Kandy Warehouse</option>
        </select>
      </div>
      <div style="display:flex;align-items:center;justify-content:center;height:42px;color:#98A2B3">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M5 12h14M13 6l6 6-6 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
      <div class="field">
        <label>To *</label>
        <select>
          <option>Kandy Warehouse</option>
          <option>Main Branch</option>
          <option>Galle Outlet</option>
        </select>
      </div>
      <div class="field">
        <label>Transfer date</label>
        <input type="date" value="2026-07-17" />
      </div>
    </section>

    <section class="card" style="display:flex;flex-direction:column;overflow:hidden">
      <div style="display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid #E4E7EC">
        <h3 style="margin:0;font-size:14.5px;font-weight:700">Items to transfer</h3>
        <div style="position:relative;width:280px">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" style="position:absolute;left:11px;top:10px" aria-hidden="true"><circle cx="11" cy="11" r="7" stroke="#98A2B3" stroke-width="1.8"/><path d="M21 21l-4.3-4.3" stroke="#98A2B3" stroke-width="1.8" stroke-linecap="round"/></svg>
          <input placeholder="Search item…" style="width:100%;height:36px;border-radius:8px;border:1px solid #D0D5DD;padding:0 12px 0 32px;font-size:13px;box-sizing:border-box" />
        </div>
      </div>

      <div style="display:grid;grid-template-columns:2.2fr 1fr 1fr 0.5fr;padding:11px 20px;font-size:11.5px;font-weight:700;color:#98A2B3;letter-spacing:0.04em;text-transform:uppercase;background:#FAFAFC;border-bottom:1px solid #EEF0F3">
        <span>Item</span><span>Available at Main Branch</span><span>Transfer qty</span><span></span>
      </div>

      <div style="display:grid;grid-template-columns:2.2fr 1fr 1fr 0.5fr;padding:13px 20px;font-size:13.5px;align-items:center;border-bottom:1px solid #F3F4F7">
        <div>
          <div style="font-weight:600">Samsung Galaxy M55 — 128GB</div>
          <div style="font-size:12px;color:#98A2B3">PROD-219109</div>
        </div>
        <span style="color:#15803D;font-weight:600">18</span>
        <input value="5" style="height:34px;width:70px;border-radius:7px;border:1px solid #D0D5DD;padding:0 8px;font-size:13px" />
        <button type="button" aria-label="Remove item" style="width:28px;height:28px;border-radius:7px;border:none;background:transparent;color:#98A2B3;cursor:pointer">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        </button>
      </div>
      <div style="display:grid;grid-template-columns:2.2fr 1fr 1fr 0.5fr;padding:13px 20px;font-size:13.5px;align-items:center">
        <div>
          <div style="font-weight:600">Hikvision CCTV camera</div>
          <div style="font-size:12px;color:#98A2B3">PROD-607942</div>
        </div>
        <span style="color:#15803D;font-weight:600">38</span>
        <input value="10" style="height:34px;width:70px;border-radius:7px;border:1px solid #D0D5DD;padding:0 8px;font-size:13px" />
        <button type="button" aria-label="Remove item" style="width:28px;height:28px;border-radius:7px;border:none;background:transparent;color:#98A2B3;cursor:pointer">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        </button>
      </div>

      <div style="padding:14px 20px">
        <button type="button" style="height:38px;padding:0 16px;border-radius:9px;border:1px dashed #C7CCDA;background:#fff;display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:#4338CA;cursor:pointer;font-family:inherit">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="#4338CA" stroke-width="2" stroke-linecap="round"/></svg>
          Add item
        </button>
      </div>
    </section>

    <section class="card" style="padding:20px;display:flex;flex-direction:column;gap:10px">
      <label style="font-size:12.5px;font-weight:600;color:#344054">Notes</label>
      <textarea placeholder="Courier, expected arrival, handling instructions…" style="min-height:80px;border-radius:9px;border:1px solid #D0D5DD;padding:11px 13px;font-size:13.5px;resize:vertical;box-sizing:border-box;outline:none"></textarea>
    </section>

  </main>
</div>
</body>
</html>
